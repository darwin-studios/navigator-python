[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-sdk"
version = "0.4.0"
description = "Official Python SDK for Darwin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Darwin" }]
keywords = ["darwin", "agent", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=3.0.0",
  "httpx>=0.23.0",
  "pydantic>=1.9.2,<3",
  "typing-extensions>=4.0.0",
]

[project.urls]
Documentation = "https://darwin.so/docs/surfaces/api"
Issues = "https://github.com/darwin-studios/darwin/issues"
Repository = "https://github.com/darwin-studios/darwin-python"

[tool.setuptools.packages.find]
where = ["src"]
include = ["darwin_sdk*"]
exclude = ["darwin_sdk.tests*"]

[tool.setuptools.package-data]
darwin_sdk = ["py.typed"]
