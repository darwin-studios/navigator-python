[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-navigator"
version = "0.5.0"
description = "Official Navigator Python SDK by Darwin"
authors = [{ name = "Darwin" }]
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = [
  "anyio>=3.0.0",
  "httpx>=0.23.0",
  "jsonschema[format]>=4.18,<5",
  "pydantic>=1.9.2,<3",
  "typing-extensions>=4.0.0",
]

[project.urls]
Documentation = "https://darwin.so/docs/interfaces/darwin/python-sdk"
Repository = "https://github.com/darwin-studios/navigator-python"

[tool.setuptools.packages.find]
where = ["generated"]

[tool.setuptools.package-data]
darwin_navigator = ["py.typed", "act_openai_contract.json"]
